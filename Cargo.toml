[workspace]
resolver = "2"
members = [
  "crates/primitives",
  "crates/crypto",
  "crates/types",
  "crates/state",
  "crates/consensus",
  "crates/runtime",
  "crates/node",
  "crates/wallet",
  "crates/network",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["CUWorldru"]

[workspace.dependencies]
blake3 = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
hex = "0.4"
libp2p = { version = "0.57", default-features = false, features = ["tokio", "tcp", "noise", "yamux", "gossipsub", "identify", "ping", "kad", "macros"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
